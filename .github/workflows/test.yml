name: Тестирование

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        oscript_version: ['stable', 'dev']
        test_engine: ['oneunit']
    uses: autumn-library/workflows/.github/workflows/test.yml@v1
    with:
      os_versions: '["ubuntu-latest", "windows-latest", "macos-15-intel"]'
      oscript_version: ${{ matrix.oscript_version }}
      test_engine: ${{ matrix.test_engine }}